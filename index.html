<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tap Countr</title>
    <style>
      :root {
        font-family: Arial, sans-serif;
        color: #111;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f2f5f9;
      }

      .app {
        width: min(420px, 92vw);
        background: #fff;
        border-radius: 14px;
        padding: 1.25rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      }

      h1 {
        margin: 0 0 1rem;
        font-size: 1.4rem;
      }

      .stat {
        font-size: 2.6rem;
        margin: 0 0 1rem;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 1rem;
      }

      label {
        font-weight: 600;
      }

      input {
        width: 100%;
        padding: 0.55rem;
        border: 1px solid #ccd2d9;
        border-radius: 8px;
        font-size: 1rem;
      }

      button {
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }

      #tap-button {
        width: 100%;
        min-height: 180px;
        font-size: 1.4rem;
        font-weight: 700;
        color: #fff;
        background: #0f6fff;
      }

      #reset-button {
        margin-top: 0.75rem;
        width: 100%;
        padding: 0.75rem;
        font-size: 1rem;
        font-weight: 600;
        color: #1f2937;
        background: #e5e7eb;
      }

      #status {
        margin: 0.75rem 0 0;
        font-weight: 600;
      }

      #status.complete {
        color: #0a7a00;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>Tap Counter</h1>
      <p class="stat"><span id="count">0</span> taps</p>

      <div class="controls">
        <label for="target-input">Target</label>
        <input id="target-input" type="number" min="1" value="100" />
      </div>

      <button id="tap-button" type="button">Tap anywhere here</button>
      <button id="reset-button" type="button">Reset</button>
      <p id="status" aria-live="polite">Tap to start. Target is 100.</p>
    </main>

    <script>
      const countEl = document.getElementById('count');
      const statusEl = document.getElementById('status');
      const targetInput = document.getElementById('target-input');
      const tapButton = document.getElementById('tap-button');
      const resetButton = document.getElementById('reset-button');

      let count = 0;
      let target = 100;

      function sanitizeTarget(value) {
        const parsed = Number.parseInt(value, 10);
        return Number.isFinite(parsed) && parsed > 0 ? parsed : 1;
      }

      function ringBell() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) {
          return;
        }

        const context = new AudioContext();
        const osc = context.createOscillator();
        const gain = context.createGain();

        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.001, context.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.25, context.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + 0.3);

        osc.connect(gain);
        gain.connect(context.destination);

        osc.start();
        osc.stop(context.currentTime + 0.3);

        osc.onended = () => {
          context.close();
        };
      }

      function updateStatus() {
        if (count >= target) {
          statusEl.textContent = `🎉 Target reached: ${count}/${target}`;
          statusEl.classList.add('complete');
          return;
        }

        const remaining = target - count;
        statusEl.textContent = `${remaining} tap${remaining === 1 ? '' : 's'} to go`;
        statusEl.classList.remove('complete');
      }

      tapButton.addEventListener('click', () => {
        count += 1;
        countEl.textContent = String(count);

        if (count === target) {
          ringBell();
        }

        updateStatus();
      });

      targetInput.addEventListener('change', () => {
        target = sanitizeTarget(targetInput.value);
        targetInput.value = String(target);
        updateStatus();
      });

      resetButton.addEventListener('click', () => {
        count = 0;
        countEl.textContent = '0';
        updateStatus();
      });

      updateStatus();
    </script>
  </body>
</html>
